storybox.audio.library-dir=/home/mejdi/audio
storybox.gpio.enabled=true

# Keep the model resident — otherwise it unloads after 5 min idle and the
# next button press pays a cold reload. 60m = stay loaded for an hour of
# inactivity before unloading (a bare "-1" fails: Ollama's Go backend
# requires a time unit even for the "forever" sentinel).
spring.ai.ollama.chat.options.keep-alive=60m

# Bound output length. Small models ramble and sometimes loop; ~450 tokens
# is a 200-250 word story and caps worst-case latency.
spring.ai.ollama.chat.options.num-predict=450

# Pi 4 has 4 cores.
spring.ai.ollama.chat.options.num-thread=4

# Your prompt is tiny (system + one selection summary). No reason to pay for
# a big context window — smaller is less RAM and faster.
spring.ai.ollama.chat.options.num-ctx=2048

spring.ai.ollama.chat.options.temperature=0.8
spring.ai.ollama.chat.options.repeat-penalty=1.1

# Don't fail the first request if the model isn't pulled yet.
spring.ai.ollama.init.pull-model-strategy=never
spring.ai.ollama.chat.options.model=LiquidAI/lfm2.5-1.2b-instruct:q4_0